name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 1.2.3 or 1.2.3-beta.1.
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unsupported version '$version'. Use 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The release notes are the matching CHANGELOG.md section. The extraction runs
      # before anything is published so a missing section is reported early, but it
      # only warns: a tag-triggered run cannot pick up a changelog fix from main.
      - name: Collect the release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { lines[++count] = $0 }
            END {
              while (first <= count && lines[first] ~ /^[[:space:]]*$/) first++
              while (count >= first && lines[count] ~ /^[[:space:]]*$/) count--
              for (i = first; i <= count; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md
          if [[ -s release-notes.md ]]; then
            echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
          else
            rm release-notes.md
            echo "::warning::CHANGELOG.md has no section for $version. Falling back to generated notes."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: source
        run: dotnet restore Manta.slnx

      - name: Build
        working-directory: source
        run: dotnet build Manta.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        working-directory: source
        run: dotnet pack Manta.slnx --configuration Release --no-build --output ../packages -p:Version=${{ steps.version.outputs.version }}

      - name: Log in to NuGet.org
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      # The temporary API key is valid for one hour, so log in right before pushing.
      - name: Push to NuGet.org
        run: |
          dotnet nuget push "packages/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "packages/*.snupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/*.nupkg --clobber
            if [[ -n "$NOTES_FILE" ]]; then
              gh release edit "$tag" --notes-file "$NOTES_FILE"
            fi
          elif [[ -n "$NOTES_FILE" ]]; then
            gh release create "$tag" --title "$tag" --notes-file "$NOTES_FILE" packages/*.nupkg
          else
            gh release create "$tag" --title "$tag" --generate-notes packages/*.nupkg
          fi
