# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "release/**" ]

jobs:
  pack:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract version from branch name
        run: echo "VERSION=${GITHUB_REF_NAME#release/}" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure NuGet to use GitHub Packages
        run: dotnet nuget add source --username oneo-me --password ${{ secrets.GH_PACKAGES_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/oneo-me/index.json"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Create the package
        run: dotnet pack --configuration Release -o Packages -p:Version=${{ env.VERSION }}

      - name: Publish the package to GPR
        run: dotnet nuget push "Packages/*.nupkg" --source "https://nuget.pkg.github.com/oneo-me/index.json" --api-key "${{ secrets.GH_PACKAGES_TOKEN }}" --skip-duplicate --no-symbols
